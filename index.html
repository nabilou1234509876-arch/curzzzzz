<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curzzzzz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mouse Glow Trail -->
    <div class="cursor-glow" id="cursor-glow"></div>

    <!-- Initial Click Overlay -->
    <div id="click-overlay">
        <h2>Click anywhere to enter</h2>
    </div>

    <!-- Background Video -->
    <div class="video-container hidden" id="video-container">
        <video id="bg-video" loop playsinline>
            <source src="your-edit.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <!-- CRT & Vignette effect for premium 4k feel -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden">
        
        <!-- Snow/Particles -->
        <div class="snow-container">
            <div class="snow">❅</div><div class="snow">✦</div><div class="snow">❅</div>
            <div class="snow">✦</div><div class="snow">❅</div><div class="snow">✦</div>
            <div class="snow">❅</div><div class="snow">✦</div><div class="snow">❅</div>
        </div>

        <div class="center-content">
            <!-- Main Name -->
            <h1 class="main-name">curzzzzz</h1>

            <!-- Discord Presence Card -->
            <div class="discord-card">
                <div class="discord-banner" id="discord-banner"></div>
                <div class="discord-content">
                    <div class="pfp-wrapper">
                        <!-- Default to your webp, Lanyard will override if active -->
                        <img src="pfp.webp" alt="Discord Avatar" class="discord-avatar" id="discord-pfp">
                        <div class="status-dot offline" id="discord-status"></div>
                        <div class="custom-status-bubble">
                            <span class="status-text">proffissional coder</span>
                        </div>
                    </div>
                    <div class="discord-info">
                        <div class="discord-name-row">
                            <span class="discord-username" id="discord-username">curzzzzz</span>
                            <div class="discord-badges">
                                <span class="badge-text" id="discord-custom-status">💧 187</span>
                                <img src="https://api.iconify.design/simple-icons:discord.svg?color=a688fa" class="badge-icon" alt="badge">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Socials -->
            <div class="bottom-socials">
                <a href="https://www.roblox.com/fr/users/5456444336/profile" target="_blank" class="social-icon-link">
                    <img src="https://api.iconify.design/simple-icons:roblox.svg?color=white" alt="Roblox">
                </a>
                <a href="https://discord.com/users/1153392848490737684" target="_blank" class="social-icon-link">
                    <img src="https://api.iconify.design/ic:baseline-discord.svg?color=white" alt="Discord">
                </a>
            </div>
        </div>

        <!-- Live Views Counter -->
        <div class="views-counter">
            <img src="https://api.iconify.design/mdi:eye.svg?color=white" alt="views">
            <span id="view-count">...</span>
        </div>

        <!-- Audio Controls -->
        <div class="audio-controls">
            <button id="mute-btn">
                <img src="https://api.iconify.design/mdi:volume-high.svg?color=white" alt="volume" id="volume-icon" width="24" height="24">
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
