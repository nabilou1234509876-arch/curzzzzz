<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curzzzzz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Initial Click Overlay -->
    <div id="click-overlay">
        <h2>Click anywhere to enter</h2>
    </div>

    <!-- Background Video -->
    <div class="video-container hidden" id="video-container">
        <video id="bg-video" loop playsinline>
            <source src="your-edit.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <!-- CRT Overlay effect -->
        <div class="scanlines"></div>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="main-content" class="hidden">
        
        <div class="layout">
            <!-- Left Column: Profile -->
            <div class="col left-col">
                <img src="pfp.webp" alt="pfp" class="pfp">
                <div class="card name-card">
                    <h3>curzzzzz</h3>
                    <span>@curzzzzz</span>
                </div>
                <div class="card status-card">
                    <span>lazy</span>
                </div>
            </div>

            <!-- Middle Column: Links -->
            <div class="col mid-col">
                <div class="card btn about-btn">
                    <img src="https://api.iconify.design/mdi:cat.svg?color=white" class="icon" alt="icon">
                    <div class="btn-text">
                        <h4>more about me</h4>
                        <p>A proffissional coder</p>
                    </div>
                </div>
                
                <div class="btn-row">
                    <a href="https://www.roblox.com/fr/users/5456444336/profile" target="_blank" class="card btn social-btn">
                        <img src="https://api.iconify.design/simple-icons:roblox.svg?color=white" class="icon" alt="Roblox">
                        <div class="btn-text">
                            <h4>Roblox</h4>
                            <p>hi ?</p>
                        </div>
                    </a>
                    
                    <a href="https://discord.com/users/1153392848490737684" target="_blank" class="card btn social-btn">
                        <img src="https://api.iconify.design/ic:baseline-discord.svg?color=white" class="icon" alt="Discord">
                        <div class="btn-text">
                            <h4>Discord</h4>
                            <p>@1153392848490737684</p>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Right Column: Image -->
            <div class="col right-col">
                <div class="img-wrapper">
                    <img src="https://i.pinimg.com/736x/60/ea/98/60ea9822a1068bd8fc76a267a1da268e.jpg" alt="aesthetic cat" class="side-img">
                </div>
            </div>
        </div>

        <!-- Audio Controls in Bottom Right -->
        <div class="audio-controls">
            <button id="mute-btn">
                <img src="https://api.iconify.design/mdi:volume-high.svg?color=white" alt="volume" id="volume-icon" width="24" height="24">
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
