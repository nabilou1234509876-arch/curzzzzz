<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curzzzzz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Initial Click Overlay -->
    <div id="click-overlay">
        <h2>Click anywhere to enter</h2>
    </div>

    <!-- Background Video -->
    <div class="video-container hidden" id="video-container">
        <video id="bg-video" loop playsinline>
            <source src="your-edit.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="main-content" class="hidden">
        <div class="profile-card">
            <h1>curzzzzz</h1>
            
            <div class="links">
                <a href="#" class="link-btn roblox">Roblox</a>
                <a href="#" class="link-btn discord">Discord</a>
                <a href="#" class="link-btn tiktok">TikTok</a>
            </div>

            <div class="audio-controls">
                <button id="mute-btn">🔊</button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
